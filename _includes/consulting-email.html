<div class="consulting-email" markdown="0">
<button type="button" class="btn btn-outline-primary" id="reveal-email" data-email="{{ consultancy.email_encoded }}" aria-controls="email-details" aria-expanded="false" hidden>Show email address</button>
<div id="email-details" hidden>
  <p class="mb-2"><a id="email-address"></a></p>
  <button type="button" class="btn btn-outline-primary btn-sm" id="copy-email">Copy email address</button>
  <p id="email-status" class="small mt-2 mb-0" role="status" aria-live="polite"></p>
</div>
<noscript><p>Enable JavaScript to reveal my email address, or use the booking link or LinkedIn to get in touch.</p></noscript>
</div>
