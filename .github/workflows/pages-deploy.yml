name: 'Automatic build'

on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
  schedule:
    # 20:00 UTC = 06:00 Australia/Brisbane (no DST). Daily rebuild so that
    # future-dated posts go live automatically on their scheduled date,
    # since Jekyll excludes future-dated posts from the build by default.
    - cron: '0 20 * * *'

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  continuous-delivery:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for posts's lastmod

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Deploy
        run: bash tools/deploy.sh
