services:
  - name: Planning your move to fibre internet
    description: Understand your NBN upgrade options and what needs to change inside your organisation. I help plan the service transition with your provider, including the effect on phones, internet access and existing equipment.
  - name: Making your network more reliable
    description: Improve Wi-Fi and connections between buildings, plan cabling requirements with your installer, or replace a firewall with a carefully prepared changeover. I help you choose equipment that suits your needs and budget.
    url: /consulting/unifi-network-design/
    link_text: UniFi network design and quote reviews
  - name: Checking a quote or planning an upgrade
    description: Get a second opinion before committing, or turn a technology problem into a clear project. I explain the alternatives, costs and priorities so you can decide what to do now and what can wait.
  - name: Protecting your accounts and information
    description: Review Microsoft 365, administrator access, email security and backups. Understand who can reach your systems, what happens if something goes wrong and which improvements deserve attention first.
  - name: Making sense of security alerts
    id: cyber-security-analysis-and-monitoring
    description: Bring security information together using tools such as Wazuh and Splunk. I help connect log sources, check detection coverage, tune alerts and build reports so your team knows what needs investigation and action.
    url: /posts/ai-security-log-analysis-graylog-wazuh/
    link_text: How I approach security log analysis
