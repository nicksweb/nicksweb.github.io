label: Great Northern Hotel before the September 2026 fire
images:
  - file: 260911-great-northern-fire-townsville-IMG_4295-The-Front-of-the-Hotel.JPG
    alt: The Great Northern Hotel's two street frontages at the Flinders and Blackwood Street intersection in Townsville.
    caption: The familiar corner, with verandahs extending along both street frontages, before the fire.
    width: 2048
    height: 1536
  - file: 260911-great-northern-fire-townsville-IMG_4284-The-Viewlooking-Towards-From-Filnders-Railway-Station.JPG
    alt: Great Northern Hotel frontage viewed from the old Townsville railway station side of Blackwood Street.
    caption: The view from the railway station side of Blackwood Street, with the Newmarket Hotel visible across the intersection.
    width: 2048
    height: 1536
  - file: 260911-great-northern-fire-townsville-IMG_4285-Carpark-Behind.JPG
    alt: The Great Northern Hotel's rear wing beside a fenced car park, with a modern office building behind it.
    caption: The rear wing and adjoining car park, showing another side of the old hotel.
    width: 2048
    height: 1536
  - file: 260911-great-northern-fire-townsville-IMG_4287-Building-Walkway.JPG
    alt: Decorative ironwork and faded hotel lettering above the Great Northern's covered footpath.
    caption: Ironwork, verandah posts and faded lettering above the footpath.
    width: 1536
    height: 2048
  - file: 260911-great-northern-fire-townsville-IMG_4288-Under-The-Footpath-Walkway.JPG
    alt: The sheltered footpath beneath the Great Northern Hotel's verandah, lined with white doors and ceiling fans.
    caption: The sheltered walk beneath the verandah, a welcome stretch of shade or cover from summer rain.
    width: 1536
    height: 2048
  - file: 260911-great-northern-fire-townsville-IMG_4289-Corner-Next.JPG
    alt: A Carlton Draught sign hangs under the verandah at the Great Northern Hotel's street corner.
    caption: Rounding the corner beneath an old Carlton Draught sign.
    width: 1536
    height: 2048
  - file: 260911-great-northern-fire-townsville-IMG_4290-patrons-sign.JPG
    alt: A Great Northern Hotel sign asks patrons to remain seated while consuming alcohol in this area.
    caption: A patrons' sign left on the wall, a reminder of the hotel's trading days.
    width: 1536
    height: 2048
  - file: 260911-great-northern-fire-townsville-IMG_4291-Footpath-Cellardoor.JPG
    alt: Timber cellar-access doors set into the footpath outside the Great Northern Hotel.
    caption: The timber cellar hatch in the footpath outside the closed doors.
    width: 1536
    height: 2048
  - file: 260911-great-northern-fire-townsville-IMG_4292-Glass-Window.JPG
    alt: A leadlight window at the Great Northern Hotel with blue and amber glass details.
    caption: A closer look at the leadlight glass, one of the building's distinctive details.
    width: 1536
    height: 2048
  - file: 260911-great-northern-fire-townsville-IMG_4293-old-doors.JPG
    alt: Closed white timber doors and worn entrance steps at 500 Flinders Street, the Great Northern Hotel.
    caption: The old entrance at 500 Flinders Street, with its worn steps and painted timber doors.
    width: 1536
    height: 2048
  - file: 260911-great-northern-fire-townsville-IMG_4283-City-Walk-Historical-Info-Sign.JPG
    alt: Townsville's Civic Pride heritage-trail plaque for the Great Northern Hotel, naming Tunbridge and Tunbridge as architects.
    caption: The Civic Pride trail plaque. It gives 1902 as the construction date; the heritage history uses 1900–1901, as discussed above.
    width: 1536
    height: 2048
